---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: software-local-ubuntu
    image: ubuntu:24.04
    pre_build_image: true
    command: /bin/bash -c "sleep infinity"
    tmpfs:
      - /run
  - name: software-local-debian
    image: debian:12
    pre_build_image: true
    command: /bin/bash -c "sleep infinity"
    tmpfs:
      - /run
  # EL8 ships python 3.6 and glibc 2.28: exercises the old-glibc neovim path
  - name: software-local-rocky8
    image: rockylinux:8
    pre_build_image: true
    command: /bin/bash -c "sleep infinity"
    tmpfs:
      - /run

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../
  inventory:
    host_vars:
      software-local-rocky8:
        ansible_python_interpreter: /usr/bin/python3.12
  config_options:
    defaults:
      ALLOW_BROKEN_CONDITIONALS: true
verifier:
  name: ansible
