---
- name: mcfly install
  ansible.builtin.include_tasks: install_github_release.yml
  vars:
    package_name: mcfly
    github_repo: cantino/mcfly
    download_url: "https://github.com/cantino/mcfly/releases/download/v{{ latest_version }}/mcfly-v{{ latest_version }}-x86_64-unknown-linux-musl.tar.gz"
