---
- hosts: 127.0.0.1
  connection: local
  become: true
  vars_files:
    - vars/postgres.yml
  roles:
    - software
  tags: ["basic", "root"]

- hosts: 127.0.0.1
  connection: local
  vars_files:
    - vars/postgres.yml
  roles:
    - enviroment
  tags: ["basic", "enviroment"]

- hosts: 127.0.0.1
  connection: local
  become: false
  vars_files:
    - vars/postgres.yml
  roles:
    - software-local
  tags: ["basic", "local"]

- hosts: 127.0.0.1
  connection: local
  become: true
  roles:
    - nodejs
  tags: ["node"]

- hosts: 127.0.0.1
  connection: local
  roles:
    - nvim-coc
  tags: ["coc"]

