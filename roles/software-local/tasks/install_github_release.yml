---
# Reusable task to install a GitHub release binary.
#
# Required variables (pass via include_tasks vars):
#   package_name   - display name and cache key
#   github_repo    - GitHub owner/repo
#   download_url   - full download URL template (may use {{ latest_version }})
#
# Optional variables:
#   binary_name      - name of binary in ~/bin/ (default: package_name)
#   strip_v          - strip leading 'v' from tag (default: true)
#   version_cmd      - shell command to get installed version
#   download_dest    - where to save download (default: /tmp/<package_name>.tar.gz)
#   is_archive       - whether download is an archive to extract (default: true)
#   extract_dest     - where to extract the archive (default: ~/bin/)
#   extract_include  - include filter for unarchive (default: omit)
#   extract_extra_opts - extra_opts for unarchive (default: omit)

- name: "{{ package_name }}| check if installed"
  ansible.builtin.stat:
    path: "~/bin/{{ binary_name | default(package_name) }}"
  register: file_data

- name: "{{ package_name }}| check for a system provided copy"
  ansible.builtin.stat:
    path: "{{ item }}/{{ binary_name | default(package_name) }}"
  loop: "{{ system_bin_dirs }}"
  register: system_copy
  when: prefer_system_packages | bool

# Use the system copy (and don't touch the GitHub API) unless we have already
# been managing our own copy in ~/bin.
- name: "{{ package_name }}| decide whether to manage a release binary"
  ansible.builtin.set_fact:
    manage_release: >-
      {{ file_data.stat.exists
         or not (prefer_system_packages | bool)
         or not (system_copy.results | default([]) | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | list | length > 0) }}

- name: "{{ package_name }}| using system package"
  ansible.builtin.debug:
    msg: "{{ package_name }} is provided by the system, skipping release install"
  when: not manage_release

- name: "{{ package_name }}| get latest version"
  ansible.builtin.include_tasks: fetch_latest_version.yml
  when: manage_release

- name: "{{ package_name }}| get installed version"
  ansible.builtin.shell: "{{ version_cmd | default('~/bin/' + (binary_name | default(package_name)) + ' -V | cut -d \" \" -f 2') }}"
  register: VERSION
  changed_when: false
  failed_when: false
  when: manage_release and file_data.stat.exists

- name: "{{ package_name }}| download and install"
  when: manage_release and ((not file_data.stat.exists) or (VERSION.stdout | default('') != latest_version))
  block:
    - name: "{{ package_name }}| download latest release"
      ansible.builtin.get_url:
        url: "{{ download_url }}"
        dest: "{{ download_dest | default('/tmp/' + package_name + '.tar.gz') }}"
        mode: "0755"

    - name: "{{ package_name }}| extract binary"
      ansible.builtin.unarchive:
        src: "{{ download_dest | default('/tmp/' + package_name + '.tar.gz') }}"
        dest: "{{ extract_dest | default('~/bin/') }}"
        include: "{{ extract_include | default(omit) }}"
        extra_opts: "{{ extract_extra_opts | default(omit) }}"
      when: is_archive | default(true) | bool
