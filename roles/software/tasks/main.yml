---
# System packages. Needs root (become). Without root skip this role with
# --skip-tags root; the software-local role then provides the tools as release
# binaries in ~/bin.
- name: Install system packages
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
    - unsupported.yml
