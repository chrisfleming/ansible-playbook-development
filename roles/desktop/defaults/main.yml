---
# GUI apps for every desktop, from the official and omarchy repos.
desktop_packages:
  - bitwarden
  - bitwarden-cli
  - signal-desktop
  - zen-browser-bin
  - ghostty
  # Logitech device manager (MX Master etc.); its udev rules give access
  # without root.
  - solaar
  # RNNoise noise suppression plugin for the microphone. Installing it only
  # provides the plugin; PipeWire needs a filter-chain config to use it.
  - noise-suppression-for-voice

# Add a noise-cancelled microphone input (needs noise-suppression-for-voice
# above). Raise the threshold if background noise still gets through, lower
# it if quiet speech gets cut off.
desktop_noise_suppression: true
desktop_noise_suppression_name: Noise Cancelling Microphone
desktop_noise_suppression_vad_threshold: 50.0

# On Omarchy, make Ghostty the default terminal (SUPER + RETURN).
desktop_ghostty_default: true

# Extra repo packages for one machine. Set per host in
# vars/hosts/<hostname>.yml (loaded automatically if it exists).
desktop_extra_packages: []

# Built from the AUR.
desktop_aur_packages:
  - thunderbird-bin

# My own apps, built from the PKGBUILD in their git repository.
desktop_own_apps:
  - name: sixmusic
    repo: https://github.com/chrisfleming/sixmusic.git
    dir: pkgbuild
  - name: pingmon
    repo: https://github.com/chrisfleming/pingmon.git
    dir: pkgbuild
